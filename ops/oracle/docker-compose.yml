# FolkIdle on the Oracle Ampere box - the whole game, client and server.
#
# NOT the repository's own docker-compose.yml, which cannot be reused here:
# that one stands up a pgbouncer in front of its Postgres and a one-shot migrate
# job. The app image migrates on its own entrypoint, and at one replica talking
# to a Postgres on the same host there is nothing to pool.
#
# Four services: the app, Postgres and Redis beside it, and Caddy - which
# terminates TLS, serves the built client, and proxies the API and the
# WebSocket to the app.
#
# Modul: POSTGRES MOVED HERE FROM SUPABASE ON 2026-09-25, because of EGRESS.
# The database is 20 MB, but every row the server read crossed the internet
# from Supabase to this box, and the free plan allows 5 GB of that a month.
# Gathering alone was about 9.3M single-row reads, one per harvest roll, and
# a player's whole equipment list was loaded 5,220 times at an average of
# 4,222 rows. The quota ran out. On the same host that traffic is free and
# costs microseconds rather than a round trip to Frankfurt. It also ends the
# 15-client session-pooler ceiling that once killed the loot worker (see
# ConnectionStringDefaults.WithBoundedPool).
#
# What Supabase used to do and this box now has to: BACKUPS. backup-db.sh runs
# nightly from cron and keeps seven dumps - see ops/oracle/README.md. The
# Supabase project was left intact as the rollback, not deleted.
# Client and server share one origin, so there is no CORS relationship between
# the two halves and only one certificate to keep.
#
# Redis is local rather than Render's managed one, because REDIS_CONNECTION
# pointed at a Render-INTERNAL hostname that does not resolve from here at all.
# Losing its data on restart is already accepted (the Render instance had
# persistence off) - and since the checkpoint learned to persist gold without
# it, an outage is now a slower flush rather than lost coins.

services:
  app:
    build:
      # Modul: the REPOSITORY ROOT. It was ../../server, which put the audio
      # clips and the sprite tree outside the build context - see
      # server/Dockerfile. Sound has never worked in production because of it.
      context: ../..
      # server/Dockerfile, NOT server/FolkIdle.Server/Dockerfile. They are two
      # different images: the inner one is compose's and starts the server
      # bare, while this one migrates first and only then serves
      # (`--migrate && exec ...`). With the schema on Supabase and no shell to
      # run a pre-deploy hook from, migrate-on-entrypoint is the only thing
      # applying migrations here. Safe at exactly one replica - see its comment.
      dockerfile: server/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      # The listener prefix is hardcoded http://+:8080/ in Program.cs.
      PORT: "8080"
      DOTNET_ENVIRONMENT: Production
      REDIS_CONNECTION: "redis:6379"
      # Modul: 40, not ConnectionStringDefaults' 12. Twelve was sized under
      # Supabase's 15-client session pooler; this Postgres allows 100, and
      # fourteen StartCron workers plus request handlers queued behind twelve.
      FOLKIDLE_DB_MAX_POOL: "40"
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    # Modul: SIGTERM runs ShutdownGracefully and flushes the Redis write-behind
    # (Program.cs). Docker's default grace is 10 s before SIGKILL, which is
    # not enough for a flush over a busy table; a killed flush loses whatever
    # was only in memory.
    stop_grace_period: 60s
    expose:
      - "8080"
    # The entrypoint migrates before serving. Safe at exactly one replica -
    # see server/Dockerfile. Do not scale this service.
    deploy:
      replicas: 1

  # The game's database. 17, to match the Supabase server it was restored
  # from (17.6) - pg_restore refuses a dump from a newer major, and an older
  # one is a downgrade nobody tested.
  #
  # NO `ports:` on purpose. Only the app reaches it, over the compose network,
  # so the database is not on the internet and neither firewall needs a hole.
  # To look at it: `docker compose exec postgres psql -U folkidle folkidle`.
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    # pg_stat_statements is what found the egress (on Supabase, where it was
    # preloaded); keeping it here is how the next hot query gets found.
    # Read it with: select calls, rows, query from pg_stat_statements
    # order by rows desc limit 20;
    command: ["postgres", "-c", "shared_preload_libraries=pg_stat_statements", "-c", "pg_stat_statements.track=top"]
    environment:
      POSTGRES_DB: folkidle
      POSTGRES_USER: folkidle
      # From .env - generated on the box at the move, never committed.
      POSTGRES_PASSWORD: "${FOLKIDLE_PG_PASSWORD:?FOLKIDLE_PG_PASSWORD must be set in ops/oracle/.env}"
    volumes:
      # Named, so the data survives `docker compose up --build` and a
      # container recreate. `docker compose down -v` DELETES it - never use -v.
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U folkidle -d folkidle"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Caddy with the built client baked in - see web.Dockerfile for why the
  # build context is the repository root and not client_web.
  caddy:
    build:
      context: ../..
      dockerfile: ops/oracle/web.Dockerfile
      args:
        # Vite INLINES this, so it is a build argument and not an environment
        # variable: a static bundle has no runtime configuration. Changing the
        # hostname means rebuilding this image, not restarting it.
        #
        # Both hostnames serve the game (see the Caddyfile), but the bundle can
        # only be built pointing at one. It points at the NAME rather than the
        # sslip.io address so that a player who arrives by the old link still
        # ends up talking to the address worth sharing - and so that the day
        # this machine changes IP, only DNS has to move.
        VITE_FOLKIDLE_SERVER: "https://folkidle.duckdns.org"
        # Modul: names the over-the-air bundle this image will carry. Computed
        # on the HOST at deploy time, because the build context has no git
        # history - see ops/oracle/README.md. Left empty it still builds; the
        # bundle is then versioned from nothing and the app's manifest endpoint
        # stays inert, which is the safe state.
        FOLKIDLE_BUNDLE_VERSION: "${FOLKIDLE_BUNDLE_VERSION:-}"
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # Modul: THE DIRECTORY, NOT THE FILE.
      #
      # Bind-mounting a single file binds its INODE. `git pull` does not edit a
      # file in place - it writes a new one and renames it over the old - so
      # the container went on serving the original inode forever. Every
      # Caddyfile change since this box was set up was invisible until the
      # container happened to be recreated, and `caddy reload` cheerfully
      # reported success each time because it was reloading the stale copy it
      # could see.
      #
      # Found because a cache header refused to appear: the config on the host
      # was right, `caddy validate` said valid, the reload said adapted - and
      # `grep -c Cache-Control` INSIDE the container answered 0.
      #
      # A directory mount follows renames, because the directory entry is what
      # changes.
      - ./caddy:/etc/caddy:ro
      # Named, so the certificate survives a rebuild. Without this every
      # `docker compose up --build` would re-issue from Let's Encrypt and walk
      # straight into their rate limit.
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  pgdata:
  caddy_data:
  caddy_config:
