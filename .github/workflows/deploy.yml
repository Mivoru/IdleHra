name: Build, Test, and Deploy

# Runs on every push to main: builds the server and its integration test
# suite, runs the full Testcontainers-backed test suite, and - only if that
# suite is green - builds the production server image and pushes it tagged
# with the commit SHA.

on:
  push:
    branches:
      - main

env:
  DOTNET_VERSION: "8.0.x"
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  TEST_PROJECT_PATH: server/FolkIdle.Server.Tests/FolkIdle.Server.Tests.csproj
  DOCKERFILE_CONTEXT: server
  DOCKERFILE_PATH: server/FolkIdle.Server/Dockerfile

jobs:
  test:
    name: Build and Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Required pre-build gate: structurally validates every
      # server/GameData/*.json against the same rules
      # ContentRegistry.Initialize/ActiveSkillEngine.Initialize enforce at
      # server boot. A malformed content file fails the pipeline here, in
      # seconds, before any dotnet build or Docker push - previously it
      # would only surface as a crash-looping pod at rollout.
      - name: Validate content data
        run: python3 ops/validate_content.py --path server/GameData

      # The audio the server actually serves. This checkout is deliberately
      # NOT lfs-enabled, which makes it an exact stand-in for the Oracle box:
      # git-lfs is not installed there either, so if *.wav is ever tracked in
      # LFS again both places get 130-byte pointer stubs and both would ship a
      # silent game. That is not hypothetical - it is what production did from
      # the day audio was added until 2026-09-02. See ops/validate_audio.py.
      - name: Validate audio clips are real audio
        run: python3 ops/validate_audio.py

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      # The Tests project has a ProjectReference to FolkIdle.Server, so
      # restoring/building it transitively restores/builds the server too -
      # there is no solution file in this repository, only individual
      # csproj files.
      - name: Restore dependencies
        run: dotnet restore "${{ env.TEST_PROJECT_PATH }}"

      - name: Build (Release)
        run: dotnet build "${{ env.TEST_PROJECT_PATH }}" --no-restore --configuration Release

      # The integration suite spins up real Postgres instances via
      # Testcontainers against the Docker daemon already available on
      # GitHub-hosted ubuntu-latest runners - no extra service containers
      # are required here.
      - name: Run integration test suite
        run: dotnet test "${{ env.TEST_PROJECT_PATH }}" --no-build --configuration Release --verbosity normal

  client:
    name: Client Checks
    runs-on: ubuntu-latest
    # Runs alongside `test` rather than after it - neither needs the other, and
    # serialising them would add several minutes for no signal.
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # The protocol check runs the SERVER to ask it for its own wire layout,
      # so this job needs the .NET SDK as well as Node.
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # Modul: 22 BECAUSE THE CAPACITOR CLI REFUSES ANYTHING OLDER.
          #
          # `@capacitor/cli` v8 declares `engines: { node: ">=22.0.0" }` and
          # enforces it itself - `npx cap sync` exits with
          # "The Capacitor CLI requires NodeJS >=22.0.0" and does nothing. This
          # was pinned at 20, so the whole native lane below had been dead
          # since Capacitor was bumped to v8, and NOBODY SAW IT: the sprite
          # check fails earlier in the same job, so that is the failure the run
          # reported. One broken step was hiding another.
          #
          # Reproduced by running the job's own commands in a `node:20`
          # container rather than by reading the log, which needs admin on the
          # repository. `node:22` gets past it.
          node-version: "22"
          cache: npm
          cache-dependency-path: client_web/package-lock.json

      - name: Install client dependencies
        working-directory: client_web
        run: npm ci

      # THE gate this job exists for. protocol.generated.ts is generated from
      # the server's own --dump-protocol and committed, so a fresh checkout
      # builds without .NET. --check regenerates and diffs instead of writing:
      # it fails if someone changed a packet struct and did not regenerate,
      # which is this codebase's dominant bug class (two copies of one truth
      # drifting apart) in the one place it can be caught mechanically.
      # Build the server first so the check reads the compiled DLL, which is
      # both an order of magnitude faster than `dotnet run` and the same path
      # every developer takes locally. The `dotnet run` fallback works again
      # as of this commit, but CI should not be the only thing exercising it.
      - name: Build the server (for --dump-protocol)
        run: dotnet build server/FolkIdle.Server/FolkIdle.Server.csproj --configuration Release

      - name: Verify generated protocol matches the server
        working-directory: client_web
        run: node scripts/generate-protocol.mjs --check

      # The same contract for artwork, plus a ratchet the protocol check does
      # not need. --check fails if sprites.generated.ts or sprites.missing.txt
      # is stale (someone added art or an item and did not regenerate) AND if
      # the number of catalogued items with no artwork has RISEN above
      # MISSING_ART_BUDGET. Two thirds of the catalogue is art-less; the budget
      # is what stops that quietly becoming three quarters.
      - name: Verify sprite coverage did not regress
        working-directory: client_web
        run: node scripts/generate-sprites.mjs --check

      # Modul: THE RATCHET USED TO LIVE HERE, IN YAML, AND ONLY HERE.
      #
      # svelte-check is not a hard gate: four errors remain, all in
      # GuildOps.svelte, all the handlers of the Guild War UI that was hidden
      # rather than removed - deleting them is a product decision, not a
      # cleanup. So the rule is "fail only if the count grows".
      #
      # That rule was implemented as a shell block in this file, which meant no
      # developer could run it - and so `npm run build` chained raw
      # `svelte-check` instead, exited 1 on the baseline, and had been broken on
      # every machine for months, taking `npm run sync` and
      # `npm run build:android` down with it. One rule, written twice, in a
      # place only one of the two callers could reach.
      #
      # It is now scripts/typecheck-ratchet.mjs, and both call it.
      - name: Type-check the client (ratcheted baseline)
        working-directory: client_web
        run: npm run check:ratchet

      # Modul: THE APK THIS JOB KEEPS HAS TO BE ABLE TO REACH A SERVER.
      #
      # This step ran as a bare `npx vite build`, and Vite INLINES the server
      # address - so with nothing set it baked in config.ts's development
      # default, http://localhost:8080. On a phone `localhost` means the phone,
      # so the debug APK uploaded below - the artefact whose own comment calls
      # it "the shortest path to A2, the device session" - could never have
      # talked to anything. It would have reached the login screen,
      # configurationProblem() would have explained itself, and that is as far
      # as any tester could have got.
      #
      # It fails POLITELY, which is why nobody found out: the client says what
      # is wrong rather than hanging, so the artefact looks like a working app
      # right up until somebody tries to sign in.
      #
      # Production does NOT come from here - ops/oracle/web.Dockerfile builds
      # its own bundle with this same value as a build arg - so this address is
      # only ever the one the test artefact points at.
      - name: Build the client bundle
        working-directory: client_web
        env:
          VITE_FOLKIDLE_SERVER: https://folkidle.duckdns.org
        run: npx vite build

      # --- the native lane -------------------------------------------------
      #
      # The mobile app is this same bundle inside a WebView, and android/ and
      # ios/ are committed - so they can rot exactly the way three separate
      # screen lists once did, silently, until someone tries a build months
      # later. `cap sync` is the cheapest thing that notices.
      #
      # WHAT THIS PROVES: capacitor.config.json parses, webDir points at
      # something that exists, every installed Capacitor plugin resolves for
      # both platforms, and the committed Gradle/Package.swift glue matches the
      # plugin set in package.json.
      #
      # WHAT IT DOES NOT PROVE, and do not let the green tick suggest
      # otherwise: nothing is compiled. No Java, no Kotlin, no Swift, no
      # Gradle, no resource or manifest merge, no APK, no .ipa, and certainly
      # no evidence that the app launches on a phone. A full `assembleDebug`
      # would need the Android SDK plus a Gradle dependency download on every
      # run (minutes and hundreds of megabytes); a release assemble would also
      # need the upload keystore, which is not a CI secret and should not
      # become one before the real bundle id is decided (TASK_BOARD C1/C2).
      # An iOS build needs a macOS runner. When any of that changes, this is
      # the step to extend.
      #
      # iOS IS synced here, and on Linux, because this project's iOS project is
      # SPM (ios/App/CapApp-SPM) rather than CocoaPods - so `cap update ios`
      # writes a Package.swift and never shells out to `pod`. Verified by the
      # same command succeeding on a Windows dev box, where no Apple toolchain
      # exists at all. If CocoaPods ever comes back, split this into
      # `npx cap sync android` and drop the ios half of the check below.
      - name: Sync the native projects
        working-directory: client_web
        run: npx cap sync

      # The ratchet half. `cap sync` regenerates capacitor.settings.gradle,
      # app/capacitor.build.gradle and the SPM manifest from the installed
      # plugin set; the copied web assets and generated configs are gitignored,
      # so a clean tree after a sync means the committed native projects and
      # package.json agree. A dirty tree means someone added or removed a
      # Capacitor plugin and did not re-sync - a build that works on their
      # machine and fails on the next person's.
      - name: Verify the committed native projects are not stale
        working-directory: client_web
        run: |
          if ! git diff --exit-code -- android ios; then
            echo "::error::android/ or ios/ is stale - run 'npm run sync:web' and commit the result"
            exit 1
          fi

      # --- and now it is COMPILED ---------------------------------------
      #
      # `cap sync` above proves the configuration parses and the plugins
      # resolve. It compiles nothing, which the previous version of this file
      # said outright: no Java, no Kotlin, no manifest merge, no APK. A green
      # tick meant "the JSON is valid".
      #
      # assembleDebug is the cheapest thing that proves the app BUILDS. It
      # catches the failures cap sync cannot see - a plugin whose minSdk is
      # above ours, two plugins pulling incompatible AndroidX versions, a
      # manifest merge conflict, a Gradle plugin that needs a newer Gradle -
      # and every one of those is a wall somebody hits on a Friday otherwise.
      #
      # DEBUG, not release, and that is deliberate: a release assemble needs
      # the upload keystore, which is not a CI secret and should not become one
      # (TASK_BOARD C2). app/build.gradle produces an unsigned release build
      # when no key is configured rather than failing, so adding the secret
      # later is the only change needed.
      #
      # Still not proven: that the app LAUNCHES. That needs an emulator or a
      # device, which is A2, and no amount of compiling substitutes for it.
      - name: Set up the JDK for Gradle
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up the Android SDK
        uses: android-actions/setup-android@v3

      # Modul: Gradle's dependency cache, keyed on the build files that decide
      # what it downloads. Without it every run re-fetches the Android Gradle
      # plugin and the AndroidX tree - minutes, and hundreds of megabytes,
      # which was the stated reason this step did not exist.
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('client_web/android/**/*.gradle*', 'client_web/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Assemble the Android debug APK
        working-directory: client_web/android
        run: ./gradlew --no-daemon assembleDebug

      # Modul: KEPT, because "it built" is worth less than something anybody
      # can install. A reviewer, a tester, or the developer's own phone can
      # take this artefact without a local toolchain - which is the shortest
      # path to A2, the device session everything else in the mobile plan is
      # waiting on.
      - name: Keep the APK
        uses: actions/upload-artifact@v4
        with:
          name: folkidle-debug-apk
          path: client_web/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

  build-and-push:
    name: Build and Push Docker Image
    # Gated on the client checks too: a server image whose packet layout no
    # longer matches the committed client protocol should not ship.
    needs: [test, client]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Cleanly parameterized via repository secrets: if REGISTRY_URL,
      # REGISTRY_USERNAME, and REGISTRY_PASSWORD are all configured, those
      # are used unchanged. If they are not configured, this falls back to
      # GitHub Container Registry (ghcr.io) under the repository owner,
      # authenticated with the automatically provided GITHUB_TOKEN - a
      # working placeholder that requires no additional account setup.
      - name: Resolve container registry
        id: registry
        run: |
          if [ -n "${{ secrets.REGISTRY_URL }}" ]; then
            echo "url=${{ secrets.REGISTRY_URL }}" >> "$GITHUB_OUTPUT"
          else
            # Modul: ghcr.io (and Docker registries generally) require an
            # all-lowercase repository path - github.repository preserves
            # the repository's actual case (e.g. "Mivoru/IdleHra"), which
            # docker/build-push-action rejects outright ("repository name
            # must be lowercase") before ever attempting the push.
            echo "url=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.REGISTRY_URL != '' && secrets.REGISTRY_URL || 'ghcr.io' }}
          username: ${{ secrets.REGISTRY_USERNAME != '' && secrets.REGISTRY_USERNAME || github.actor }}
          password: ${{ secrets.REGISTRY_PASSWORD != '' && secrets.REGISTRY_PASSWORD || secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Uses server/FolkIdle.Server/Dockerfile - the one docker-compose.yml
      # actually builds from - not the alternate server/Dockerfile
      # (a different chiseled-runtime variant with a different build
      # context that nothing else in this repository references).
      - name: Build and push server image
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.DOCKERFILE_CONTEXT }}
          file: ${{ env.DOCKERFILE_PATH }}
          push: true
          tags: |
            ${{ steps.registry.outputs.url }}:${{ github.sha }}
            ${{ steps.registry.outputs.url }}:latest

  # Applies pending EF Core migrations against the production database as a
  # one-shot K8s Job (ops/jobs/apply-migrations.yaml) using the exact image
  # just pushed, BEFORE any new server pods roll out - a single migration
  # container instead of multiple replicas racing Database.Migrate at
  # startup. The whole job is gated on the KUBE_CONFIG secret being
  # configured: until a production cluster's kubeconfig is provided, this
  # job is skipped (not failed), preserving the previous build-and-push-only
  # behavior for forks and pre-production checkouts.
  migrate:
    name: Run Migrations
    needs: build-and-push
    runs-on: ubuntu-latest
    if: ${{ vars.KUBE_DEPLOY_ENABLED == 'true' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure cluster access
        run: |
          mkdir -p "$HOME/.kube"
          printf '%s' "${{ secrets.KUBE_CONFIG }}" > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"

      - name: Resolve container registry
        id: registry
        run: |
          if [ -n "${{ secrets.REGISTRY_URL }}" ]; then
            echo "url=${{ secrets.REGISTRY_URL }}" >> "$GITHUB_OUTPUT"
          else
            # Modul: ghcr.io (and Docker registries generally) require an
            # all-lowercase repository path - github.repository preserves
            # the repository's actual case (e.g. "Mivoru/IdleHra"), which
            # docker/build-push-action rejects outright ("repository name
            # must be lowercase") before ever attempting the push.
            echo "url=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
          fi

      # Substitute the SHA-tagged image into the Job manifest, apply it,
      # and block until it completes. A failed migration fails this job,
      # which halts the pipeline before any rollout step that would depend
      # on the new schema. The delete --ignore-not-found clears any
      # previous run's completed Job (Job specs are immutable, so re-apply
      # alone cannot update the image).
      - name: Run Migrations
        run: |
          sed "s|IMAGE_PLACEHOLDER|${{ steps.registry.outputs.url }}:${{ github.sha }}|" ops/jobs/apply-migrations.yaml > /tmp/apply-migrations.yaml
          kubectl delete job folkidle-apply-migrations --ignore-not-found
          kubectl apply -f /tmp/apply-migrations.yaml
          kubectl wait --for=condition=complete --timeout=300s job/folkidle-apply-migrations

  # Rolls the SHA-tagged image out to the actual server Deployment - gated
  # on migrate, so this can never run against a database schema the new
  # image has not already been migrated against. build-and-push alone only
  # produces an image; this is the step that actually puts it in front of
  # traffic. Same KUBE_DEPLOY_ENABLED/KUBE_CONFIG gating as migrate, for the
  # same reason (skipped, not failed, until a production cluster is wired
  # up).
  deploy:
    name: Deploy to Cluster
    needs: migrate
    runs-on: ubuntu-latest
    if: ${{ vars.KUBE_DEPLOY_ENABLED == 'true' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure cluster access
        run: |
          mkdir -p "$HOME/.kube"
          printf '%s' "${{ secrets.KUBE_CONFIG }}" > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"

      - name: Resolve container registry
        id: registry
        run: |
          if [ -n "${{ secrets.REGISTRY_URL }}" ]; then
            echo "url=${{ secrets.REGISTRY_URL }}" >> "$GITHUB_OUTPUT"
          else
            # Modul: ghcr.io (and Docker registries generally) require an
            # all-lowercase repository path - github.repository preserves
            # the repository's actual case (e.g. "Mivoru/IdleHra"), which
            # docker/build-push-action rejects outright ("repository name
            # must be lowercase") before ever attempting the push.
            echo "url=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
          fi

      # Substitutes the SHA-tagged image into deployment.yaml (mirroring the
      # migrate job's IMAGE_PLACEHOLDER substitution pattern, just against
      # deployment.yaml's own literal "folkidle-server:latest" placeholder
      # tag rather than a dedicated token) and applies it alongside hpa.yaml,
      # which carries no image reference and is applied unchanged. Blocks on
      # rollout completion so a failed/stuck rollout fails this job loudly.
      - name: Apply deployment manifests
        run: |
          sed "s|image: folkidle-server:latest|image: ${{ steps.registry.outputs.url }}:${{ github.sha }}|" server/deployment.yaml > /tmp/deployment.yaml
          kubectl apply -f /tmp/deployment.yaml -f server/hpa.yaml
          kubectl rollout status deployment/folkidle-server --timeout=180s
