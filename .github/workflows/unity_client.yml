name: Unity Client CI/CD

on:
  push:
    branches:
      - main
    paths:
      - "client/**"
      - ".github/workflows/unity_client.yml"
  workflow_dispatch:

env:
  UNITY_VERSION: "6000.5.2f1"

jobs:
  licence-check:
    name: Check Unity Licence Availability
    runs-on: ubuntu-latest
    environment: Unity
    outputs:
      configured: ${{ steps.probe.outputs.configured }}
    steps:
      - name: Probe for UNITY_LICENSE
        id: probe
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        run: |
          if [ -n "$UNITY_LICENSE" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
            echo "UNITY_LICENSE is configured - Unity test and build jobs will run."
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "UNITY_LICENSE is not configured - skipping the Unity test and build jobs."
          fi

  test:
    name: Unity Test Suite (${{ matrix.testMode }})
    runs-on: ubuntu-latest
    needs: licence-check
    if: needs.licence-check.outputs.configured == 'true'
    environment: Unity
    strategy:
      fail-fast: false
      matrix:
        testMode:
          - EditMode
          - PlayMode
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: client/Library
          key: Library-client-${{ matrix.testMode }}-${{ hashFiles('client/Assets/**', 'client/Packages/**', 'client/ProjectSettings/**') }}
          restore-keys: |
            Library-client-${{ matrix.testMode }}-
            Library-client-

      - name: Run ${{ matrix.testMode }} tests
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: client
          unityVersion: ${{ env.UNITY_VERSION }}
          testMode: ${{ matrix.testMode }}
          artifactsPath: client-test-results-${{ matrix.testMode }}
          checkName: Unity ${{ matrix.testMode }} Test Results

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: client-test-results-${{ matrix.testMode }}
          path: client-test-results-${{ matrix.testMode }}
          retention-days: 14

  build-android:
    name: Android Release Build
    needs: test
    runs-on: ubuntu-latest
    environment: Unity
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: client/Library
          key: Library-client-build-${{ hashFiles('client/Assets/**', 'client/Packages/**', 'client/ProjectSettings/**') }}
          restore-keys: |
            Library-client-build-
            Library-client-

      - name: Build Android release (client.apk and Addressable bundles)
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          # The CDN root that will serve the remote catalog and bundles.
          # BuildPipelineController creates the "Production" Addressables
          # profile from this on first run; it fails the build loudly when
          # unset rather than defaulting, because Production content built
          # against a placeholder URL ships and then cannot load. Add a
          # FOLKIDLE_CDN_BASE_URL repository variable (or secret) to enable
          # the release build.
          FOLKIDLE_CDN_BASE_URL: ${{ vars.FOLKIDLE_CDN_BASE_URL }}
        with:
          projectPath: client
          unityVersion: ${{ env.UNITY_VERSION }}
          targetPlatform: Android
          buildMethod: FolkIdle.Client.Editor.BuildPipelineController.ExecuteAndroidReleaseBuild
          customParameters: -silent-crashes -logFile -

      - name: Verify build outputs exist
        run: |
          if [ ! -f "client/build_output/client.apk" ]; then
            echo "client.apk was not produced at client/build_output/client.apk - failing the pipeline."
            exit 1
          fi
          if [ ! -d "client/build_output/cdn" ]; then
            echo "Addressable CDN staging directory was not produced at client/build_output/cdn - failing the pipeline."
            exit 1
          fi

      - name: Upload client.apk artifact
        uses: actions/upload-artifact@v4
        with:
          name: client-apk
          path: client/build_output/client.apk
          retention-days: 30

      - name: Upload Addressable CDN bundles artifact
        uses: actions/upload-artifact@v4
        with:
          name: client-cdn-bundles
          path: client/build_output/cdn
          retention-days: 30

      - name: Stage Addressable bundles to S3/Cloudflare R2
        if: env.CDN_S3_BUCKET != ''
        env:
          CDN_S3_BUCKET: ${{ secrets.CDN_S3_BUCKET }}
          AWS_ACCESS_KEY_ID: ${{ secrets.CDN_S3_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CDN_S3_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.CDN_S3_REGION || 'auto' }}
        run: |
          ENDPOINT_ARGS=""
          if [ -n "${{ secrets.CDN_S3_ENDPOINT_URL }}" ]; then
            ENDPOINT_ARGS="--endpoint-url ${{ secrets.CDN_S3_ENDPOINT_URL }}"
          fi
          aws s3 sync client/build_output/cdn "s3://${{ secrets.CDN_S3_BUCKET }}/${{ github.sha }}" $ENDPOINT_ARGS --no-progress
