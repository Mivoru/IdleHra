name: Acquire Unity License

on:
  workflow_dispatch:

jobs:
  activation:
    name: Generate ALF File
    runs-on: ubuntu-latest
    container:
      image: unityci/editor:ubuntu-6000.0.0f1-base-3.0.0
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create ALF file
        run: |
          unity-editor \
            -batchmode \
            -nographics \
            -createManualActivationFile \
            -logfile /dev/stdout || true
          
          # Najde a přejmenuje vygenerovaný .alf soubor pro artefakt
          ALF_FILE=$(ls *.alf 2>/dev/null | head -n 1)
          if [ -n "$ALF_FILE" ]; then
            echo "Vygenerován soubor: $ALF_FILE"
          else
            echo "Při generování ALF nastala chyba!"
            exit 1
          fi

      - name: Upload ALF file
        uses: actions/upload-artifact@v4
        with:
          name: Unity-Activation-File
          path: '*.alf'
