<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Modul: interactive-widget=resizes-content makes mobile Chrome shrink
         the layout viewport for the soft keyboard, which is what the APK's
         WebView already does. Without it the two disagreed: Chrome's default
         (resizes-visual) left fixed bars behind the keyboard, so one layout
         could not be right on both. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />

    <title>FolkIdle - a Slavic idle RPG</title>

    <!-- Modul: WHAT A SHARED LINK LOOKS LIKE.
         This page carried a title and nothing else, so a link posted to
         Discord, Reddit or anywhere else with a preview card rendered as a
         bare URL - which is the difference between someone clicking and
         someone scrolling past. For a game with no marketing budget a shared
         link IS the marketing, and this is the cheap half of being findable.

         The other half is not a tag: search engines rank pages other pages
         link to, so a new game with no inbound links will not appear in
         results no matter what sits in this head. Reddit's incremental-games
         community, itch.io and Discord are where players for this genre
         actually come from. -->
    <meta
      name="description"
      content="FolkIdle is a browser idle RPG rooted in Slavic folklore. Fight through five regions, craft tools, fish, mine and build a village - it keeps playing while you are away, and a season leaves your village, your mastery and what you bought behind."
    />
    <!-- One per theme, matching --bg in src/app.css for each. A single dark
         value painted a dark browser bar over the parchment theme. -->
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#100d0a" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#e8dcc0" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="FolkIdle" />
    <meta property="og:title" content="FolkIdle - a Slavic idle RPG" />
    <meta
      property="og:description"
      content="Fight, craft, fish and build a village in a browser idle RPG rooted in Slavic folklore. It keeps playing while you are away."
    />
    <meta name="twitter:card" content="summary" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
