<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Modul: interactive-widget=resizes-content makes mobile Chrome shrink
         the layout viewport for the soft keyboard, which is what the APK's
         WebView already does. Without it the two disagreed: Chrome's default
         (resizes-visual) left fixed bars behind the keyboard, so one layout
         could not be right on both. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />

    <title>FolkIdle - a Slavic idle RPG</title>

    <!-- Modul: WHAT A SHARED LINK LOOKS LIKE.
         This page carried a title and nothing else, so a link posted to
         Discord, Reddit or anywhere else with a preview card rendered as a
         bare URL - which is the difference between someone clicking and
         someone scrolling past. For a game with no marketing budget a shared
         link IS the marketing, and this is the cheap half of being findable.

         The other half is not a tag: search engines rank pages other pages
         link to, so a new game with no inbound links will not appear in
         results no matter what sits in this head. Reddit's incremental-games
         community, itch.io and Discord are where players for this genre
         actually come from. -->
    <meta
      name="description"
      content="FolkIdle is a browser idle RPG rooted in Slavic folklore. Fight through five regions, craft tools, fish, mine and build a village - it keeps playing while you are away, and a season leaves your village, your mastery and what you bought behind."
    />
    <!-- One per theme, matching --bg in src/app.css for each. A single dark
         value painted a dark browser bar over the parchment theme. -->
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#100d0a" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#e8dcc0" />

    <!-- Modul: MOBILE WEB INSTALL, task 110d. "Add to Home Screen" from a
         phone's browser used to save a screenshot-icon bookmark that opened
         with the URL bar. The manifest gives Chrome on Android the name, icon,
         standalone display and portrait lock (the APK's own lock); iOS Safari
         ignores most of it and reads the apple-* tags below instead. Icons are
         composed from resources/icon.png by `npm run generate:icons`, and
         Vite copies public/ to the site root. The manifest's colours are the
         dark theme's --bg, the default: a manifest cannot follow the system
         scheme the way the two theme-color metas above do. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="48x48" href="/icons/favicon-48.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="FolkIdle" />
    <!-- black-translucent draws the page under the status bar, which the
         layout already handles: viewport-fit=cover plus the safe-area insets
         (see client_web/CLAUDE.md, "The phone draws under the status bar"). -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <!-- Modul: ONE ADDRESS FOR SEARCH ENGINES. The same page answers on
         folkidle.cz, www.folkidle.cz, folkidle.duckdns.org and the sslip.io
         name (the APK still talks to duckdns, so none can be dropped - see
         ops/oracle/caddy/Caddyfile). Four copies of one page split whatever
         ranking it earns four ways, and the engine picks which one to show.
         The canonical link tells it: show folkidle.cz. -->
    <link rel="canonical" href="https://folkidle.cz/" />
    <!-- Modul: THE LOGIN PAINTING, REQUESTED WITH THE BUNDLE. It is the LCP of
         the page a stranger lands on, and as a CSS background inside a Svelte
         component nothing could ask for it until the bundle had downloaded,
         parsed and mounted Login - measured on a throttled phone, the request
         started 5.2 s in. Same URL Login.svelte builds (sprites.ts, same
         origin on https), or the browser downloads it twice. -->
    <link rel="preload" as="image" href="/sprites/Backgrounds/login_valley_q55.webp" type="image/webp" fetchpriority="high" />
    <!-- What a search result is titled with and what the brand search
         ("folkidle", "folk idle", "folkidle hra") is matched against. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "WebSite",
            "name": "FolkIdle",
            "alternateName": ["Folk Idle", "FolkIdle game", "FolkIdle hra"],
            "url": "https://folkidle.cz/"
          },
          {
            "@type": "VideoGame",
            "name": "FolkIdle",
            "alternateName": "Folk Idle",
            "url": "https://folkidle.cz/",
            "image": "https://folkidle.cz/loading/landscape-1280.jpg",
            "description": "A browser idle RPG rooted in Slavic folklore. Fight through five regions, craft, fish, mine and build a village - it keeps playing while you are away.",
            "genre": ["Idle game", "Incremental game", "RPG"],
            "gamePlatform": ["Web browser", "Android"],
            "applicationCategory": "Game",
            "operatingSystem": "Any",
            "inLanguage": "en",
            "offers": { "@type": "Offer", "price": "0", "priceCurrency": "EUR" }
          }
        ]
      }
    </script>

    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://folkidle.cz/" />
    <meta property="og:image" content="https://folkidle.cz/loading/landscape-1280.jpg" />
    <meta property="og:image:width" content="1280" />
    <meta property="og:image:height" content="715" />
    <meta property="og:site_name" content="FolkIdle" />
    <meta property="og:title" content="FolkIdle - a Slavic idle RPG" />
    <meta
      property="og:description"
      content="Fight, craft, fish and build a village in a browser idle RPG rooted in Slavic folklore. It keeps playing while you are away."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- Modul: THE LOADING SCREEN LIVES HERE, NOT IN A COMPONENT.
         Its whole job is to cover the time BEFORE the app exists: the bundle
         downloading and parsing, then the session restore, the socket and the
         first snapshot. A Svelte component could only appear after the first
         of those, so the player would still stare at a blank page for the
         longest part. Plain HTML and CSS paint with the first byte.

         The app reports what it is doing through window.__boot (the script at
         the top of <body>; typed wrapper and the steps in src/lib/ui/boot.ts)
         and this is removed when the first state arrives, or when a login
         form, a connection problem or the 25 s safety timeout means the
         player needs to see the app instead. -->
    <style>
      #boot {
        position: fixed;
        inset: 0;
        z-index: 2147483000;
        background: #100d0a;
        color: #f1e4c4;
        font-family: Georgia, 'Iowan Old Style', 'Palatino Linotype', 'Book Antiqua', serif;
        transition: opacity 0.45s ease;
      }
      #boot.boot-out {
        opacity: 0;
        pointer-events: none;
      }
      #boot picture,
      #boot img {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
      #boot img {
        object-fit: cover;
        /* The art's title sits in its top band; on a screen shaped unlike the
           art, crop from the bottom so the name stays in view (a portrait
           tablet lost the top of the letters at 20%). */
        object-position: 50% 0;
        animation: boot-in 0.6s ease both;
      }
      /* A phone is narrower than the portrait art (390x844 against 1536x2752),
         and cover would cut both ends off the painted title. Fit the width
         instead, pinned under the status bar; the band left at the bottom is
         where the bar sits anyway. */
      @media (max-aspect-ratio: 1536/2752) {
        #boot img {
          object-fit: contain;
          object-position: 50% var(--safe-area-inset-top, env(safe-area-inset-top, 0px));
        }
      }
      /* A scrim under the bar so the message reads over any part of the art. */
      #boot::after {
        content: '';
        position: absolute;
        inset: auto 0 0 0;
        height: 34%;
        background: linear-gradient(to bottom, rgba(16, 13, 10, 0), rgba(16, 13, 10, 0.88) 62%);
      }
      .boot-panel {
        position: absolute;
        z-index: 1;
        left: 50%;
        bottom: calc(var(--safe-area-inset-bottom, env(safe-area-inset-bottom, 0px)) + clamp(28px, 7vh, 72px));
        transform: translateX(-50%);
        width: min(560px, calc(100% - 48px));
        text-align: center;
      }
      /* The trough: a forged iron bar with a brass rim, and diamond end caps
         like the studs on the icon's frame. */
      .boot-bar {
        position: relative;
        height: 18px;
        padding: 3px;
        border: 2px solid #8a6a34;
        border-radius: 3px;
        background: linear-gradient(#0b0907, #231b13);
        box-shadow:
          inset 0 2px 4px rgba(0, 0, 0, 0.8),
          0 0 0 1px #2a1f14,
          0 4px 14px rgba(0, 0, 0, 0.6);
      }
      .boot-bar::before,
      .boot-bar::after {
        content: '';
        position: absolute;
        top: 50%;
        width: 14px;
        height: 14px;
        border: 2px solid #d8b45a;
        background: radial-gradient(circle at 35% 35%, #f6dc8f, #8a6a34 60%, #3b2a14);
        transform: translateY(-50%) rotate(45deg);
        box-shadow: 0 0 6px rgba(0, 0, 0, 0.7);
      }
      .boot-bar::before { left: -12px; }
      .boot-bar::after { right: -12px; }
      /* Modul: EVERY MOVING PART IS A TRANSFORM. The fill grew by `width` and
         the sheen slid by `background-position`, neither of which the
         compositor can run, so each frame was a main-thread layout and paint
         while the bundle was parsing on that same thread (PageSpeed,
         "non-composited animations"). Now the fill is full width and slides
         in from the left inside a clipping track, the sheen is a wider layer
         translated across it, and the ember rides its own full-width rail -
         outside the track, so the clip does not cut its glow. The script
         below sets the same translateX on the fill and the rail. */
      .boot-track,
      .boot-rail {
        position: absolute;
        inset: 3px;
      }
      .boot-track {
        overflow: hidden;
        border-radius: 1px;
      }
      .boot-fill,
      .boot-rail {
        transform: translateX(-100%);
        transition: transform 0.5s cubic-bezier(0.25, 0.8, 0.3, 1);
      }
      .boot-fill {
        position: absolute;
        inset: 0;
        overflow: hidden;
        background: linear-gradient(to bottom, #ffcf6e, #e2731f 45%, #9c3a0c);
        box-shadow: 0 0 10px rgba(255, 140, 40, 0.55);
      }
      /* A sheen sliding along the molten metal, and an ember at its edge. */
      .boot-fill::before {
        content: '';
        position: absolute;
        top: 0;
        bottom: 0;
        left: 0;
        width: 200%;
        background: linear-gradient(100deg, transparent 40%, rgba(255, 244, 210, 0.55) 50%, transparent 60%);
        animation: boot-sheen 1.8s linear infinite;
      }
      .boot-rail::after {
        content: '';
        position: absolute;
        top: -4px;
        right: -6px;
        width: 12px;
        height: calc(100% + 8px);
        border-radius: 50%;
        background: radial-gradient(#fff6d8, rgba(255, 170, 60, 0.7) 45%, transparent 70%);
        animation: boot-ember 0.9s ease-in-out infinite alternate;
      }
      .boot-msg {
        margin: 14px 0 0;
        min-height: 1.4em;
        font-size: clamp(15px, 2.2vw, 18px);
        letter-spacing: 0.02em;
        text-shadow: 0 1px 3px #000, 0 0 12px rgba(0, 0, 0, 0.8);
      }
      .boot-pct {
        margin-left: 0.5em;
        color: #d8b45a;
        font-variant-numeric: tabular-nums;
      }
      @keyframes boot-in { from { opacity: 0; } }
      @keyframes boot-sheen { from { transform: translateX(-100%); } to { transform: translateX(50%); } }
      @keyframes boot-ember { from { opacity: 0.55; } to { opacity: 1; } }
      @media (prefers-reduced-motion: reduce) {
        #boot img, .boot-fill::before, .boot-rail::after { animation: none; }
        .boot-fill, .boot-rail { transition: none; }
      }
    </style>
  </head>
  <body>
    <div id="boot">
      <h1 style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap">FolkIdle - a Slavic folklore idle RPG</h1>
      <!-- One image per orientation: a phone downloads the portrait art at
           its own width and never the landscape file. -->
      <!-- portrait-800 exists for the common phone: 412 CSS px at DPR 1.75
           needs 721 px, one past 720, and without it the browser took 1080.
           AVIF first: a third of the bytes of the JPEG at no visible cost (q35,
           compared crop against crop), and on a phone this picture shares the
           first seconds of bandwidth with the bundle. The JPEGs stay as the
           fallback and as og:image - preview cards do not all read AVIF. -->
      <picture>
        <source
          media="(orientation: portrait)"
          type="image/avif"
          srcset="/loading/portrait-720.avif 720w, /loading/portrait-800.avif 800w, /loading/portrait-1080.avif 1080w"
          sizes="100vw"
        />
        <source
          media="(orientation: portrait)"
          srcset="/loading/portrait-720.jpg 720w, /loading/portrait-1080.jpg 1080w"
          sizes="100vw"
        />
        <source
          type="image/avif"
          srcset="/loading/landscape-1280.avif 1280w, /loading/landscape-1920.avif 1920w"
          sizes="100vw"
        />
        <img
          src="/loading/landscape-1920.jpg"
          srcset="/loading/landscape-1280.jpg 1280w, /loading/landscape-1920.jpg 1920w"
          sizes="100vw"
          alt=""
          fetchpriority="high"
        />
      </picture>
      <div class="boot-panel">
        <div class="boot-bar" role="progressbar" aria-label="Loading" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
          <span class="boot-track"><span class="boot-fill"></span></span>
          <span class="boot-rail"></span>
        </div>
        <p class="boot-msg" aria-live="polite"><span class="boot-text">Loading the game&hellip;</span><span class="boot-pct">0%</span></p>
      </div>
    </div>
    <script src="/boot.js"></script>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
